workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.reconstruccion.sas
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build iOS
        script: |
          BUILD_NO=$(date -u +%s)
          echo "Commit: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"
          echo "Build number: $BUILD_NO"
          if [ ! -f "$HOME/export_options.plist" ]; then
            echo "ERROR: falta $HOME/export_options.plist (no corrio xcode-project use-profiles)"
            exit 1
          fi
          echo "Export options generados por use-profiles:"
          cat "$HOME/export_options.plist"
          if ! flutter build ipa --release --build-number=$BUILD_NO --export-options-plist=$HOME/export_options.plist; then
            echo "ERROR: fallo el build/exportArchive (firma)."
            echo "Revisa: paso 'Set up code signing settings on Xcode project' y que el perfil App Store tenga el certificado subido (verde) en Codemagic."
            exit 1
          fi
          ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist)
          echo "CFBundleVersion del archive: $ACTUAL"
          if [ "$ACTUAL" != "$BUILD_NO" ]; then
            echo "ERROR: CFBundleVersion ($ACTUAL) no es el esperado ($BUILD_NO)"
            exit 1
          fi
          ls -la build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build Android bundle
        script: flutter build appbundle --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk
